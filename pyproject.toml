[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-data-suite"
version = "0.1.0"
description = "Synthetic pharmaceutical sales and inventory analytics"
requires-python = ">=3.12"
dependencies = ["SQLAlchemy>=2.0,<3", "pandas>=2.2,<3", "psycopg[binary]>=3.2,<4", "streamlit>=1.41,<2", "plotly>=5.24,<7", "python-dotenv>=1.0,<2", "pydantic>=2.10,<3", "APScheduler>=3.11,<4", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
pharma = "pharma_suite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
